<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BOCCHI SKY RUMBLE</title>
<style>
:root{--bg:#080a10;--text:#eef2ff;--muted:#aeb7cc;--gold:#f3d14b;--pink:#ff4f9c;--cyan:#78f4ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#05070b;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;overflow:hidden}
body{display:flex;justify-content:center;align-items:flex-start;overscroll-behavior:none}

.wrap{width:min(100vw,calc((100dvh - 112px) * .5625));max-width:540px;padding:4px 4px 6px;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;min-height:100dvh;justify-content:flex-start}
.top,.stats,.actions,.note{display:none}
.outerHud{display:flex;align-items:center;justify-content:space-between;gap:3px;width:100%}
.miniStats{display:flex;gap:2px;flex-wrap:nowrap;flex:1;min-width:0}.miniStat{background:#060914e8;border:1px solid #ffffff25;border-radius:6px;padding:2px 3px;min-width:0;flex:1 1 0;text-align:center}.miniStat small{display:block;font-size:6px;line-height:1;color:#bfc8db;letter-spacing:.02em}.miniStat b{font-size:9px;line-height:1.08;white-space:nowrap}
.topBtns{display:flex;gap:3px;flex:0 0 auto;pointer-events:auto}.topBtns button{min-height:24px;padding:2px 6px;border-radius:6px;border:1px solid #ffffff35;background:#0b1020cc;color:white;font-size:9px;font-weight:900}
.stage{position:relative;width:100%;aspect-ratio:9/16;max-height:calc(100dvh - 112px);border:1px solid #30384c;border-radius:12px;overflow:hidden;background:#000;touch-action:none}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
.hudOverlay{display:none}
.centerStartWrap{position:absolute;z-index:11;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#startBtn{pointer-events:auto;min-width:180px;min-height:68px;border-radius:999px;border:2px solid #ffd3e6;background:linear-gradient(180deg,#ff82bc,#c93179);color:#fff;font-size:28px;font-weight:1000;letter-spacing:.06em;box-shadow:0 8px 28px rgba(0,0,0,.45),0 0 24px rgba(255,120,180,.45)}
#startBtn.hidden{display:none}
.touchHint{position:absolute;z-index:7;left:50%;top:12px;transform:translateX(-50%);background:#0009;border:1px solid #ffffff25;border-radius:999px;padding:4px 8px;font-size:9px;pointer-events:none;transition:.25s;white-space:nowrap}
.messageOverlay{position:absolute;z-index:8;left:8px;right:8px;bottom:58px;text-align:center;font-size:9px;color:#eef2ff;background:#050915a8;border:1px solid #ffffff22;border-radius:8px;padding:4px 7px;pointer-events:none;min-height:24px}
.actionOverlay{position:absolute;z-index:9;left:7px;right:7px;bottom:7px;display:grid;grid-template-columns:1.15fr .8fr 1.15fr;gap:5px;pointer-events:auto}.actionOverlay button{min-height:44px;border:1px solid #ffffff35;background:#10172bdb;color:#fff;border-radius:10px;padding:4px 5px;font-weight:1000;font-size:10px;line-height:1.08}.actionOverlay button:disabled{opacity:.38}.actionOverlay #specialBtn{border-color:#ffe77975}.actionOverlay #armorBtn{border-color:#78f4ff88}.actionOverlay #bombBtn{border-color:#ff779188}

</style>
</head>
<body>
<div class="wrap">
  <div class="outerHud">
    <div class="miniStats">
      <div class="miniStat"><small>SCORE</small><b id="score">0</b></div>
      <div class="miniStat"><small>HP</small><b id="hp">100</b></div>
      <div class="miniStat"><small>SP</small><b id="sp">0</b></div>
      <div class="miniStat"><small>PWR</small><b id="power">1</b></div>
      <div class="miniStat"><small>CHAIN</small><b id="combo">0</b></div>
      <div class="miniStat"><small>STG</small><b id="stageNum">1</b></div>
    </div>
    <div class="topBtns">
      <button id="bossPreviewBtn">ボス確認</button><button id="pauseBtn" disabled>PAUSE</button>
      <button id="soundBtn">♪</button>
    </div>
  </div>
  <div class="stage" id="stageWrap">
    <canvas id="game" width="720" height="1280" tabindex="0"></canvas>
    <div class="centerStartWrap" id="centerStartWrap"><button id="startBtn">START</button></div>
    <div class="touchHint" id="touchHint">画面をなぞって移動・通常弾は自動</div>
    <div class="messageOverlay" id="message">P敵を倒して強化。BOCCHI砲はSP100で発射！</div>
    <div class="actionOverlay">
      <button id="specialBtn">MEGA<br>BOCCHI砲</button>
      <button id="bombBtn">BOMB ×2</button>
      <button id="armorBtn" disabled>ARMOR<br>TAKEOFF</button>
    </div>
  </div>
</div>
<script>
(()=>{
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
const $=id=>document.getElementById(id);
let breakFx=[];
let bullets=[],enemyBullets=[],enemies=[],particles=[],items=[],midBoss=null,giantMisaki=null,damageTexts=[];
let ending=null,hitStop=0;
let running=false,paused=false,last=0,raf=0,score=0,stage=1,spawnT=0,midBossStarted=false,giantStarted=false,shake=0,flash=0,frame=0,spawnCount=0,bomb=2,combo=0,comboTimer=0,bossCutin=0,bossCutinText='';
const p={x:W/2,y:H-155,w:52,h:70,hp:100,sp:0,speed:900,fireCd:0,armor:false,armorT:0,inv:0,power:1};
let dragging=false,targetX=p.x,targetY=p.y;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
const hit=(a,b)=>Math.abs(a.x-b.x)<(a.w+b.w)/2&&Math.abs(a.y-b.y)<(a.h+b.h)/2;

const audio={ctx:null,master:null,bgmTimer:null,bgmMode:'stage',enabled:true,
 init(){if(this.ctx)return this.resume();const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=.55;const limiter=this.ctx.createDynamicsCompressor();limiter.threshold.value=-12;limiter.ratio.value=8;this.master.connect(limiter);limiter.connect(this.ctx.destination);this.resume();this.setMode('stage');},
 resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
 setMode(mode){this.bgmMode=mode;if(this.bgmTimer)clearInterval(this.bgmTimer);if(!this.enabled||!this.ctx)return;this.musicStep=0;this.nextBeat=this.ctx.currentTime+.04;this.bgmTimer=setInterval(()=>{const now=this.ctx.currentTime;if(!this.enabled||paused||(!running&&!ending)){this.nextBeat=now+.04;return;}if(this.nextBeat<now-.1)this.nextBeat=now+.02;while(this.nextBeat<now+.1){this.musicTick(this.musicStep++,this.nextBeat);const bpm=this.bgmMode==='ending'?104:this.bgmMode==='boss'?(148+(giantMisaki?giantMisaki.phase:1)*8):this.bgmMode==='mid'?152:144;this.nextBeat+=60/bpm/4;}},25);},
 musicTick(step,t){
 const end=this.bgmMode==='ending',boss=this.bgmMode==='boss',phase=boss&&giantMisaki?giantMisaki.phase:1;
 const roots=end?[60,55,57,53]:boss?[45,41,43,40]:[48,44,46,43];
 const root=roots[Math.floor(step/16)%4],beat=step%16,note=n=>440*Math.pow(2,(n-69)/12);
 const melody=end?[12,16,19,24,19,16,14,19]:boss?[12,19,15,22,19,15,14,10]:[12,16,19,24,22,19,16,14];
 if(step%2===0){const m=melody[Math.floor(step/2)%8];this.tone(note(root+m),end?.25:.14,end?'triangle':'square',end?.06:.035,t);}
 if(step%4===0){this.tone(note(root-12),.22,'triangle',.12,t);if(!end)this.tone(145,.14,'sine',.22,t,.30);}
 if(beat===4||beat===12){this.noise(.105,end?.025:.095,t,6500);if(!end)this.tone(180,.09,'triangle',.07,t,.6);}
 if(!end&&step%2===0)this.noise(.028,.035,t,11000);
 if(step%8===0){for(const n of [0,end?4:3,7])this.tone(note(root+n),.42,'triangle',.025,t);}
 if(boss&&phase>=2&&step%2===1)this.tone(note(root+melody[step%8]+12),.07,'triangle',.035,t);
 if(boss&&phase===3&&(beat===10||beat===14))this.tone(135,.12,'sine',.16,t,.3);
 },
 explosion(big=false){if(!this.ctx||!this.enabled)return;const t=this.ctx.currentTime;if(t<(this.blastUntil||0))return;this.blastUntil=t+.055;this.tone(180,big?.6:.42,'sine',.48,t,.24);this.tone(75,.48,'triangle',.20,t+.025,.55);this.noise(.09,.32,t,7500);this.noise(big?.75:.48,.30,t+.035,950);this.noise(.22,.09,t+.14,2300);},
 comboCue(){const t=this.ctx?.currentTime||0;if(t<(this.comboUntil||0))return;this.comboUntil=t+.6;this.tone(784,.08,'triangle',.08,t);this.tone(1047,.12,'triangle',.07,t+.07);},

 tone(freq,dur=.08,type='square',vol=.03,when=0,slide=1){if(!this.ctx||!this.enabled)return;const t0=when||(this.ctx?.currentTime||0);const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t0);o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*slide),t0+dur);g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(this.master);o.start(t0);o.stop(t0+dur+.02);},
 noise(dur=.06,vol=.03,when=0,lp=1200){if(!this.ctx||!this.enabled)return;const t0=when||(this.ctx?.currentTime||0);const len=Math.max(1,Math.floor(this.ctx.sampleRate*dur));const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);const data=buf.getChannelData(0);for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);const src=this.ctx.createBufferSource();src.buffer=buf;const filter=this.ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=lp;const g=this.ctx.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);src.connect(filter);filter.connect(g);g.connect(this.master);src.start(t0);src.stop(t0+dur+.02);},
 hit(){const now=this.ctx?.currentTime||0;if(now<(this.hitUntil||0))return;this.hitUntil=now+.045;this.tone(980,.035,'square',.018,0,.85);}, enemyDie(){this.tone(220,.08,'triangle',.03);this.noise(.05,.02,0,900);}, playerHurt(){this.tone(120,.18,'sawtooth',.05,0,.55);this.noise(.12,.03,0,700);}, item(){this.tone(523,.05,'triangle',.025);this.tone(659,.06,'triangle',.02,(this.ctx?.currentTime||0)+.05);this.tone(784,.07,'triangle',.02,(this.ctx?.currentTime||0)+.10);}, special(){this.tone(392,.08,'square',.03);this.tone(523,.10,'square',.03,(this.ctx?.currentTime||0)+.06);this.tone(784,.16,'square',.035,(this.ctx?.currentTime||0)+.14);}, bomb(){this.explosion(true);}, partBreak(){this.explosion(true);}, bossWarn(){this.tone(185,.20,'sawtooth',.03);this.tone(155,.20,'sawtooth',.03,(this.ctx?.currentTime||0)+.22);}, clear(){this.tone(523,.10,'triangle',.03);this.tone(659,.12,'triangle',.03,(this.ctx?.currentTime||0)+.12);this.tone(784,.16,'triangle',.03,(this.ctx?.currentTime||0)+.26);}, toggle(){this.enabled=!this.enabled;if(this.master)this.master.gain.value=this.enabled?.55:0;$('soundBtn').textContent=this.enabled?'♪':'×♪';if(this.enabled)this.setMode(this.bgmMode); else if(this.bgmTimer)clearInterval(this.bgmTimer);}};

function burst(x,y,n=18,col='#fff'){for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-220,220),vy:rnd(-240,100),life:rnd(.25,.75),life0:rnd(.25,.75),s:rnd(2,8),col,kind:Math.random()<.22?'shard':'spark',rot:rnd(0,6.28),vr:rnd(-9,9),grav:rnd(40,120)})}
function breakBurst(x,y,col='#ffd1e5',scale=1){
 // Localized layered blast: hot core, rolling fireballs, shock rings and debris.
 for(let i=0;i<80;i++){const angle=rnd(0,Math.PI*2),speed=rnd(160,650)*scale,life=rnd(.5,1.05);particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-70,life,life0:life,s:rnd(3,10),col:['#fff6cc','#ffbc57',col][i%3],kind:i%3===0?'shard':'spark',rot:angle,vr:rnd(-12,12),grav:180});}
 for(let i=0;i<7;i++){const angle=i*Math.PI*2/7,dist=i?rnd(28,62)*scale:0,life=.55+i*.045;breakFx.push({x:x+Math.cos(angle)*dist,y:y+Math.sin(angle)*dist,r:12,life,life0:life,col,kind:'fireball',scale});}
 for(let i=0;i<3;i++)breakFx.push({x,y,r:18+i*24,life:.7-i*.1,life0:.7-i*.1,col:i===1?'#fff5c2':col,kind:'ring',scale});
 breakFx.push({x,y,r:25,life:.48,life0:.48,col:'#fff4cb',kind:'star',scale});
